<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HaymGraph</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div id="app-container">
        <!-- Header Bar -->
        <header class="header-bar">
            <div class="brand">
                <div class="brand-icon">
                    <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M3 18 C 7 18, 9 6, 21 6" />
                    </svg>
                </div>
                <span class="brand-title">HaymGraph</span>
            </div>

            <div class="header-actions">
                <!-- Position Overshoot Locked Badge -->
                <div id="overshoot-badge" class="overshoot-badge hidden" title="Spatial Position speed cannot go negative. Click to Separate Dimensions.">
                    <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                        <rect x="3" y="11" width="18" height="11" rx="2" ry="2" />
                        <path d="M7 11V7a5 5 0 0 1 10 0v4" />
                    </svg>
                    <span>Locked</span>
                </div>

                <!-- Settings & Updates Icon Button -->
                <button id="btn-settings" class="header-icon-btn" title="Settings & Updates" aria-label="Settings">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="12" cy="12" r="3" />
                        <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z" />
                    </svg>
                    <span id="update-dot" class="update-dot hidden" title="Update available!"></span>
                </button>
            </div>
        </header>

        <!-- Curve Box Viewport Card (Expanded) -->
        <main class="curve-viewport-card">
            <div class="viewport-info-overlay">
                <div id="badge-extrema" class="viewport-badge">Y: [0.00, 1.00]</div>
            </div>
            <div id="curve-box-container" class="curve-canvas-wrapper"></div>
        </main>

        <!-- Icon Action Toolbar: Reverse, Analyze, Enter (Icon Only) -->
        <footer class="action-toolbar">
            <button id="btn-reverse" class="action-icon-btn" title="Reverse Curve" aria-label="Reverse">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M8 3 4 7l4 4" />
                    <path d="M4 7h16" />
                    <path d="m16 21 4-4-4-4" />
                    <path d="M20 17H4" />
                </svg>
            </button>
            <button id="btn-analyze" class="action-icon-btn" title="Analyze Keyframes (Eye)" aria-label="Analyze">
                <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z" />
                    <circle cx="12" cy="12" r="3.2" />
                </svg>
            </button>
            <button id="btn-apply" class="action-icon-btn btn-enter" title="Apply Curve (Enter)" aria-label="Apply">
                <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round">
                    <polyline points="9 10 4 15 9 20" />
                    <path d="M20 4v7a4 4 0 0 1-4 4H4" />
                </svg>
            </button>
        </footer>

        <!-- Status Line -->
        <div class="status-bar">
            <div class="status-text">
                <span id="status-dot" class="status-dot active"></span>
                <span id="status-msg">Ready</span>
            </div>
            <div id="mixed-indicator" style="display:none; color: #f59e0b;" title="Selection has mixed curves">
                ⚠️ Mixed
            </div>
        </div>
    </div>

    <!-- Position Overshoot Fixer Modal -->
    <div id="overshoot-modal" class="modal-backdrop">
        <div class="modal-dialog">
            <div class="modal-header">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="3" y="11" width="18" height="11" rx="2" ry="2" />
                    <path d="M7 11V7a5 5 0 0 1 10 0v4" />
                </svg>
                <div class="modal-title">Position Overshoot Fixer</div>
            </div>
            <div class="modal-body">
                The current curve contains overshoot (<span id="modal-overshoot-range"></span>), but spatial Position properties cannot express negative speed unless dimensions are separated.
            </div>
            <div class="modal-actions">
                <button id="btn-separate-apply" class="btn-separate">Separate Dimensions & Apply</button>
                <button id="btn-apply-clamped" class="btn-modal-cancel">Apply Clamped to 0</button>
                <button id="btn-modal-close" class="btn-modal-cancel">Cancel</button>
            </div>
        </div>
    </div>

    <!-- Settings & Updates Modal -->
    <div id="settings-modal" class="modal-backdrop">
        <div class="modal-dialog">
            <div class="modal-header">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="12" r="3" />
                    <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z" />
                </svg>
                <div class="modal-title">Settings & Updates</div>
            </div>
            <div class="modal-body settings-form">
                <div class="setting-row">
                    <span class="setting-label">Current Version</span>
                    <span id="setting-version-tag" class="setting-val-badge">v1.0.0</span>
                </div>
                <div class="setting-field">
                    <label for="setting-repo-input" class="setting-label">GitHub Repository</label>
                    <input type="text" id="setting-repo-input" class="setting-input" placeholder="username/repo" spellcheck="false" />
                </div>
                <div class="setting-toggle-row">
                    <label class="setting-toggle-label">
                        <input type="checkbox" id="setting-autocheck-toggle" checked />
                        <span>Check for updates automatically</span>
                    </label>
                </div>
                <div id="update-status-box" class="update-status-box">
                    Ready to check for updates.
                </div>
            </div>
            <div class="modal-actions">
                <button id="btn-check-updates" class="btn-separate">Check for Updates</button>
                <button id="btn-download-update" class="btn-separate hidden">View Release on GitHub</button>
                <button id="btn-settings-close" class="btn-modal-cancel">Close</button>
            </div>
        </div>
    </div>

    <!-- Script Dependencies -->
    <script src="js/coreMath.js"></script>
    <script src="js/csInterface.js"></script>
    <script src="js/update.js"></script>
    <script src="js/curveBox.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
